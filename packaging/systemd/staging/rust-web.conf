# Replace RELEASE with the reviewed, immutable release directory before staging.
# Install only as dunkingsheep-web.service.d/90-rust-desk.conf after review.
[Service]
WorkingDirectory=%h/.local/share/dunkingsheep/releases/RELEASE
ExecStart=
ExecStart=%h/.local/share/dunkingsheep/releases/RELEASE/ds-desk
# The Python unit uses DUNKINGSHEEP_DIR for its release root. Rust uses it for
# daemon state; the working directory above supplies the matching UI bundle.
Environment=DUNKINGSHEEP_DIR=%h/.config/dunkingsheep

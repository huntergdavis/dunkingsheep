# Stage as dunkingsheep-web.service.d/90-rust-desk.conf only after review.
# Roll back by removing this drop-in, daemon-reload, and restarting the unit.
[Service]
ExecStart=
ExecStart=%h/.local/share/dunkingsheep/current/ds-desk
# The Python unit uses DUNKINGSHEEP_DIR for its release root. Rust uses it for
# daemon state, while WorkingDirectory still points at the release and its UI.
Environment=DUNKINGSHEEP_DIR=%h/.config/dunkingsheep

# The Rust port workspace (docs/rust/RUST_PORT.md section 2, TASKS.md T00).
#
# Phase 1 (daemon, CLI, MCP) is the cutover unit and lives in ds-core + ds-cli +
# ds-mcp; ds-tui and ds-web are phase 3. Members are added by the task that
# creates them, so this file stays small and `cargo build` on the bare workspace
# keeps working at every step.
[workspace]
resolver = "2"
members = [
    "crates/ds-core",
    "crates/ds-cli",
    "crates/ds-mcp",
    "crates/ds-tui",
    "crates/ds-web",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order (owner-approved 2026-10-31) keeps INSERTION order like Python dicts for JSON parity.
# arbitrary_precision preserves Python-size JSON integers for API validation instead of rounding
# overflowing integer tokens to f64. preserve_order pulls in `indexmap`; sort_keys=True sites sort.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
# T52 (ds-core/github.rs): GitHub App JWT signing and REST calls. jsonwebtoken
# replaces PyJWT; reqwest uses rustls and async APIs. The boring fallback is the
# existing Python GitHub client until this Rust path is integrated and accepted.
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# T42 (ds-cli): the one parser crate RUST_PORT.md section 3 pins; the builder API is used
# (not derive) because the command tree is generated data, not Rust types.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
# Phase 3 framework decisions (t1527): axum is reserved for the ds-web adapter;
# ratatui + crossterm provide the ds-tui renderer and terminal input.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["std", "crossterm_0_29"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows"] }

[package]
name = "ds-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dunking Sheep core: the library every Rust binary shares (docs/rust/RUST_PORT.md section 2)."

[dependencies]
serde.workspace = true
serde_json.workspace = true
# T02: the pinned crates from RUST_PORT.md section 3 that these six modules need.
thiserror = "2"
nix = { version = "0.29", features = ["fs", "process", "signal", "socket"] }
# T05 (db.rs): RUST_PORT.md section 3 pins these two for the writer actor and the
# read pool - rusqlite bundled (same SQLite everywhere, FTS5 for memory later) and
# tokio's sync/runtime for the actor + oneshot replies.
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "macros", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# T51 (memory/pure.rs): RUST_PORT.md section 3 pins `regex` for "the handful of
# compiled patterns (pane ids, box detection)" - the redaction patterns are the
# same kind, and a hand-written matcher for ten credential shapes would be worse.
regex = "1"
# T51 (memory/ingest.rs): chunk dedupe digests; `sha2` is on the RUST_PORT.md section 3 list.
sha2 = "0.10"
# T40 (server.rs): `tracing` is on the RUST_PORT.md section 3 list and rule 7 requires it for the
# daemon log texts; no subscriber is installed here (the daemon binary owns that).
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "service"
harness = false

[package]
name = "ds-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dunking Sheep core: the library every Rust binary shares (docs/rust/RUST_PORT.md section 2)."

[dependencies]
serde.workspace = true
serde_json.workspace = true
# T02: the pinned crates from RUST_PORT.md section 3 that these six modules need.
thiserror = "2"
nix = { version = "0.29", features = ["fs", "process", "signal"] }
# T05 (db.rs): RUST_PORT.md section 3 pins these two for the writer actor and the
# read pool - rusqlite bundled (same SQLite everywhere, FTS5 for memory later) and
# tokio's sync/runtime for the actor + oneshot replies.
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

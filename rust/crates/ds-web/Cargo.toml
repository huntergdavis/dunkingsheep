[package]
name = "ds-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dunking Sheep web adapter foundation (docs/rust/RUST_PORT.md section 2)."

[dependencies]
axum = { workspace = true, features = ["ws", "query"] }
base64 = "0.22"
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
subtle = "2"
# Reuse the already-locked chrono used by ds-core to match Python's local log timestamp;
# std SystemTime has no local-time formatter, and UTC output would change log_message.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ds-core = { path = "../ds-core" }
# Static file bodies stream as a `stream::unfold` over the open file (t3330). futures-util is already
# locked through axum and default features stay off, so no crate is added to the lock. The boring
# fallback is the whole-file read this replaces.
futures-util = { version = "0.3", default-features = false }
serde.workspace = true
serde_json.workspace = true
# fs and io-util let static bodies read through tokio::fs (t3330). Neither adds a crate to the lock.
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "fs", "io-util", "signal", "process"] }
# Dispatch framed requests into Axum without Hyper's incompatible framing layer.
tower = { version = "=0.5.3", features = ["util"] }

[target.'cfg(unix)'.dependencies]
# Reuse locked nix safe wrappers: ds-web forbids unsafe code, shell tools and DNS are unnecessary.
# Discovery failures retain only independently discovered local names/IPs, otherwise fail closed.
nix = { version = "=0.29.0", default-features = false, features = ["hostname", "net"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

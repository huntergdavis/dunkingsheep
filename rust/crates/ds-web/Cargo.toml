[package]
name = "ds-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dunking Sheep web adapter foundation (docs/rust/RUST_PORT.md section 2)."

[dependencies]
axum.workspace = true
# Reuse the already-locked chrono used by ds-core to match Python's local log timestamp;
# std SystemTime has no local-time formatter, and UTC output would change log_message.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ds-core = { path = "../ds-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
# Dispatch framed requests into Axum without Hyper's incompatible framing layer.
tower = { version = "=0.5.3", features = ["util"] }

[dev-dependencies]
tempfile = "3"

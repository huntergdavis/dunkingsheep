[package]
name = "ds-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The dunkingsheep command line (T42: the generated parser; commands land in later tasks)."

[[bin]]
name = "dunkingsheep"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ds-core = { path = "../ds-core" }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
# context digest takes `now` (NaiveDateTime); the same pinned chrono ds-core uses.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

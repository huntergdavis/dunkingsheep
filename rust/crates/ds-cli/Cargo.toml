[package]
name = "ds-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The dunkingsheep command line (T42: the generated parser; commands land in later tasks)."

[[bin]]
name = "dunkingsheep"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde_json.workspace = true
# t811: local-time printers follow the host TZ like Python time.localtime (owner decision, %126).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

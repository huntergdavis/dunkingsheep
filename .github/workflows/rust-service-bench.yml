name: Rust service benchmark

on:
  pull_request:
    paths:
      - "rust/crates/ds-core/benches/service.rs"
      - "rust/crates/ds-core/src/terminal/**"
      - "rust/crates/ds-core/Cargo.toml"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - ".github/workflows/rust-service-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
      - name: Measure synthetic pane table
        shell: bash
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc --version
            uname -a
            cargo bench --manifest-path rust/Cargo.toml -p ds-core --bench service -- bench_list_panes_1000
          } 2>&1 | tee service-benchmark.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-benchmark
          path: service-benchmark.txt

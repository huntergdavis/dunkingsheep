name: Rust service benchmark

on:
  pull_request:
    paths:
      - "rust/crates/ds-core/benches/service.rs"
      - "rust/crates/ds-core/src/terminal/**"
      - "docs/rust/BENCH.md"
      - "rust/crates/ds-core/Cargo.toml"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - ".github/workflows/rust-service-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
      - name: Measure pane table and real socket RPCs
        shell: bash
        run: |
          set -o pipefail
          {
            git rev-parse HEAD
            rustc --version
            uname -a
            lscpu
            uptime
            export DS_BENCH_DIR="$GITHUB_WORKSPACE"
            cargo bench --manifest-path rust/Cargo.toml -p ds-core --bench service -- bench_list_panes_1000 bench_status_30_clients bench_inbox_read bench_task_next
          } 2>&1 | tee service-benchmark.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-benchmark
          path: service-benchmark.txt

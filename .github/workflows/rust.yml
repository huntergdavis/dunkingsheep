# The Rust port's gates (TASKS.md rule 3: tests pass, clippy clean, fmt clean).
#
# There was no Rust workflow before this: the only workflow in the repo was
# secret-scan.yml, so "clippy is a CI-only gate" (T02's note) meant "CI does not run
# it either" - the gate existed in the task text and nowhere else. This adds the two
# gates are blocking only after they have passed on current main.
#
#   fmt + build + test   blocking. Clippy was initially non-blocking until the
#                        complete current-main workspace passed `-D warnings`.
#   clippy               blocking after the cleanup batch merged and current-main
#                        CI ran the exact command successfully.
name: rust

on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  # NO paths filter on pull_request (t1370): these jobs are about to be REQUIRED checks on main,
  # and a required check that never reports (a PR touching no rust/ file: a Python fix, docs,
  # packaging, ui/) blocks that PR forever under enforce_admins. The jobs take about a minute,
  # so running on every PR is the boring, safe choice.
  pull_request:

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      # t1490: tests that build their own directory under the shared temp dir leak it on every
      # run (31,557 dirs, 3.8 GB once filled the host's tmpfs); use testsupport::dir / tempfile.
      - run: python3 tools/check_test_tempdirs.py

  build-and-test:
    name: cargo build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --manifest-path rust/Cargo.toml --workspace
      - run: cargo test --manifest-path rust/Cargo.toml --workspace

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

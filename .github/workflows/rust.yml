# Rust checks required by protected main: cargo fmt --check, cargo build + test,
# and cargo clippy. The Clippy job became blocking after the cleanup batch and an
# exact current-main `-D warnings` run passed.
#
#   fmt + build + test   blocking. Clippy was initially non-blocking until the
#                        complete current-main workspace passed `-D warnings`.
#   clippy               blocking after the cleanup batch merged and current-main
#                        CI ran the exact command successfully.
#   production-replay-send (t1605 slice 3) runs the send replay against a throwaway sandbox
#                        daemon in an owner pane, with its own tmux server and no secrets.
#                        Slice 4 added the task-follow replay (task_add, task_follow,
#                        task_followers, task_unfollow) to the same job. It is not a required
#                        check yet.
name: rust

on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  # NO paths filter on pull_request (t1370): these jobs are about to be REQUIRED checks on main,
  # and a required check that never reports (a PR touching no rust/ file: a Python fix, docs,
  # packaging, ui/) blocks that PR forever under enforce_admins. The jobs take about a minute,
  # so running on every PR is the boring, safe choice.
  pull_request:

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test oracle restoration safeguards
        run: python3 -I tests/test_restore_python_oracle.py
      - name: Restore pinned Python test oracle
        run: python3 tools/restore_python_oracle.py
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      # t1490: tests that build their own directory under the shared temp dir leak it on every
      # run (31,557 dirs, 3.8 GB once filled the host's tmpfs); use testsupport::dir / tempfile.
      - run: python3 tools/check_test_tempdirs.py
      # t3474: the generated CLI table, its help goldens and the release identity (VERSION and
      # CODE_HASH, which hash the root Python modules) must match the Python parser. A Python change
      # that moves the code hash without `python3 tools/gen_cli_rs.py --write` fails here. The
      # generator is pinned to 3.14, the interpreter the files were written with, because argparse
      # output can differ between Python releases and the runner's default python3 is 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python3 tools/gen_cli_rs.py --check

  build-and-test:
    name: cargo build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Python test oracle
        run: python3 tools/restore_python_oracle.py
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # t4601: the terminal stream tests drive a private tmux server, and the desk's initial
      # screen depends on tmux control-mode behaviour. Production runs tmux 3.6; the runner image
      # ships an older one. Build 3.6 from the upstream release tarball (sha256 pinned, cached).
      # Boring fallback: if the download fails the image's tmux is used, with a warning, so an
      # outage upstream does not block CI. A tarball with the wrong hash fails the job.
      - name: Cache tmux 3.6
        id: tmux-cache
        uses: actions/cache@v4
        with:
          path: ~/tmux-3.6
          key: tmux-3.6-136db80cfbfb-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build tmux 3.6 (production version)
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          url=https://github.com/tmux/tmux/releases/download/3.6/tmux-3.6.tar.gz
          work=$(mktemp -d)
          if ! curl -fsSL --retry 3 --max-time 120 -o "$work/tmux.tar.gz" "$url"; then
            echo "::warning title=tmux 3.6 download failed::terminal tests will run on the runner image's tmux, not the production version"
            exit 0
          fi
          echo "136db80cfbfba617a103401f52874e7c64927986b65b1b700350b6058ad69607  $work/tmux.tar.gz" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq libevent-dev libncurses-dev bison pkg-config
          tar -xzf "$work/tmux.tar.gz" -C "$work"
          cd "$work/tmux-3.6"
          ./configure --prefix="$HOME/tmux-3.6" >/dev/null
          make -j2 >/dev/null
          make install >/dev/null
      - name: Select tmux for the tests
        run: |
          if [ -x "$HOME/tmux-3.6/bin/tmux" ]; then
            echo "$HOME/tmux-3.6/bin" >> "$GITHUB_PATH"
            "$HOME/tmux-3.6/bin/tmux" -V
          else
            echo "::warning title=tmux fallback::using the runner image's tmux: $(tmux -V)"
          fi
      - name: tmux version used by the tests
        run: command -v tmux && tmux -V
      - run: cargo build --manifest-path rust/Cargo.toml --workspace
      - run: cargo test --manifest-path rust/Cargo.toml --workspace

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Python test oracle
        run: python3 tools/restore_python_oracle.py
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

  # t1605 slice 3. The job creates its own throwaway sandbox inside one temp directory: a tmux server
  # on a private socket, a sandbox daemon with its own state, and an owner pane (pane %2). The owner
  # registers itself with superuser recover from its own process tree, then replays the recorded
  # send traffic and the recorded task-follow traffic (t1605 slice 4) from there. No token, no
  # secret, and no live socket. The unit tests run first.
  production-replay-send:
    name: production replay (send, task follow)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned Python test oracle
        run: python3 tools/restore_python_oracle.py
      - name: install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: gate unit tests (no daemon, no tmux)
        run: |
          for test in test_production_replay test_diff_harness_sandbox test_send_scenario test_task_follow_scenario test_ci_production_replay; do
            python3 -I "tests/$test.py"
          done
      - name: replay the recorded send and task-follow traffic from an owner pane
        run: bash tools/ci_production_replay.sh

  # t3384, the Rust daemon. The same replay as production-replay-send, but the sandbox daemon and the
  # owner's superuser recover run the dunkingsheep binary built from this commit (DS_BIN). The build runs
  # inside this job, so the job has its own timeout. The Python job keeps its five minutes.
  production-replay-send-rust:
    name: production replay (send, Rust daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned Python test oracle
        run: python3 tools/restore_python_oracle.py
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      # Release build: a debug binary hashes its own executable at start (flock/status.rs), and that is
      # about 95 s on a loaded host (owner i45559). The release binary starts in about a second.
      - name: build the dunkingsheep binary (release)
        run: cargo build --release --manifest-path rust/Cargo.toml -p ds-cli --bin dunkingsheep
      - name: gate unit tests (no daemon, no tmux)
        run: |
          for test in test_production_replay test_diff_harness_sandbox test_send_scenario test_task_follow_scenario test_ci_production_replay; do
            python3 -I "tests/$test.py"
          done
      - name: replay the recorded send traffic against the Rust daemon
        env:
          DS_BIN: ${{ github.workspace }}/rust/target/release/dunkingsheep
        run: bash tools/ci_production_replay.sh

  # t3471: the cutover rollout tooling (tools/rust_rollout.sh). Its unit tests run under a fake HOME
  # with stub systemctl, journalctl, cargo, sqlite3 and dunkingsheep, so this job touches no real
  # service and no real state. The script is also checked for POSIX syntax.
  rust-rollout-tests:
    name: rollout tooling (fake HOME)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore pinned Python test oracle
        run: python3 tools/restore_python_oracle.py
      - name: script syntax
        run: sh -n tools/rust_rollout.sh
      - name: poll-only install and rollback (scratch)
        run: sh packaging/poll-only/test.sh
      - name: rollout unit tests (fake HOME, stub tools)
        run: python3 -I -W error::ResourceWarning tests/test_rust_rollout.py

name: Public-repo secret scan

# t746: huntergdavis/dunkingsheep is PUBLIC. Commit 52847e5 published
# data/auth.json, data/owner-credentials (a cleartext `Password:` line and an
# `API token:` line) and data/messages.sqlite3 from a `git add -A` after a test run,
# and raw.githubusercontent still serves them - a force-push does not unpublish a
# SHA. This is the gate that refuses the next one at push, instead of waiting for a
# lane to notice.
#
# The scan reads TRACKED files only: an ignored file is the point of .gitignore, and
# an untracked one is not published. tools/check_public_secrets.py carries the rules
# and its allowlist entries each have a written reason.

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No secret-shaped file is tracked in this public repo
        run: python3 tools/check_public_secrets.py
      - name: The scanner's own tests (fixtures, allowlist, exit code, .gitignore)
        run: python3 -m unittest discover -s tests -p 'test_check_public_secrets.py' -v
